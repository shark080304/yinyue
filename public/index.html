  @layer baseline, prototype;
  @layer prototype {
  @scope (#app[data-view="home"]) {
:scope{
  --mint:#2ec4b6; --sky:#4cc9f0; --lilac:#c77dff; --pink:#ff6fb5;
  --ink:#1b2136; --sub:#7d869c; --line:#eef1f7;
  --bg:#f4f9fb; --card:#ffffff;
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:16px; --sp-xl:24px; --sp-xxl:40px;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
:scope{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Roboto,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{max-width:1440px;margin:0 auto;height:900px;display:flex;flex-direction:column;
  background:var(--bg);box-shadow:0 0 40px rgba(27,33,54,.08)}
.layout{flex:1;display:flex;min-height:0}

/* ---------- 左侧导航 ---------- */
.sidebar{width:228px;flex-shrink:0;padding:20px 14px;background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:20px}
.logo{display:flex;align-items:center;gap:8px;padding:0 8px 4px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--mint),var(--sky) 55%,var(--lilac));
  display:flex;align-items:center;justify-content:center;color:#fff}
.logo-name{font-size:16px;font-weight:700}
.logo-name small{display:block;font-size:10px;color:var(--sub);font-weight:500;letter-spacing:.08em}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  font-size:14px;color:#4a5268;cursor:pointer;transition:.18s}
.nav-item .material-icons{font-size:19px}
.nav-item:hover{background:#f2f7f9}
.nav-item.active{background:linear-gradient(135deg,rgba(46,196,182,.14),rgba(199,125,255,.14));
  color:#0f8d84;font-weight:600}
.nav-title{font-size:11px;color:#aab2c4;padding:6px 12px;letter-spacing:.06em}
.pl-item{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:10px;font-size:13px;color:#4a5268;cursor:pointer}
.pl-item:hover{background:#f2f7f9}
.pl-dot{width:22px;height:22px;border-radius:7px;flex-shrink:0}

/* ---------- 主体 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 28px;background:#fff;
  border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;
  border-radius:19px;background:#f1f5f8;color:var(--sub);font-size:13px;cursor:pointer}
.chip-day{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lilac));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer}
.content{flex:1;overflow:auto;padding:24px 28px 12px}

.hero{margin-bottom:26px}
.hero h1{font-size:24px;font-weight:700}
.hero p{font-size:13px;color:var(--sub);margin-top:4px}

/* banner */
.banners{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:16px;margin-bottom:28px}
.banner{position:relative;height:158px;border-radius:var(--r-lg);overflow:hidden;padding:20px;color:#fff;
  display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;
  box-shadow:0 6px 18px rgba(27,33,54,.10)}
.banner .material-icons{position:absolute;top:16px;right:16px;font-size:30px;color:rgba(255,255,255,.5)}
.b-tag{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.28);align-self:flex-start;margin-bottom:8px}
.b-name{font-size:18px;font-weight:700}
.b-desc{font-size:12px;opacity:.9;margin-top:3px}
.b1{background:linear-gradient(135deg,#ff9a8b,#ff6fb5 45%,#c77dff)}
.b2{background:linear-gradient(135deg,#2ec4b6,#4cc9f0)}
.b3{background:linear-gradient(135deg,#7b6ef6,#c77dff 60%,#ff8fd0)}

.section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.section-head h2{font-size:17px;font-weight:700}
.section-head span{font-size:12px;color:var(--sub)}
.more{margin-left:auto;font-size:12px;color:#0f8d84;cursor:pointer}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.album{background:#fff;border-radius:var(--r-md);padding:10px;cursor:pointer;transition:.18s;
  box-shadow:0 2px 8px rgba(27,33,54,.05)}
.album:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(27,33,54,.12)}
.cover{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;
  justify-content:center;color:#fff;font-size:26px;font-weight:700;letter-spacing:.02em}
.cover .material-icons{position:absolute;right:8px;bottom:8px;font-size:20px;color:rgba(255,255,255,.85);
  background:rgba(0,0,0,.18);border-radius:50%;padding:3px}
.c1{background:linear-gradient(135deg,#ff6fb5,#ffd479)}
.c2{background:linear-gradient(135deg,#4cc9f0,#c77dff)}
.c3{background:linear-gradient(135deg,#2ec4b6,#a8f0c9)}
.c4{background:linear-gradient(135deg,#7b6ef6,#ff8fd0)}
.c5{background:linear-gradient(135deg,#ffb347,#ff6f91)}
.c6{background:linear-gradient(135deg,#38c1d8,#8ad6f7)}
.c7{background:linear-gradient(135deg,#f78fd8,#b28dff)}
.c8{background:linear-gradient(135deg,#5bd6b4,#f2f7a1)}
.album-name{font-size:13px;font-weight:600;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album-sub{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 今日歌曲列表 */
.track-panel{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;margin-bottom:28px}
.card{background:#fff;border-radius:var(--r-md);padding:8px 14px;box-shadow:0 2px 8px rgba(27,33,54,.05)}
.track{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.track:last-child{border-bottom:none}
.track:hover{background:#fafdff}
.mini{width:40px;height:40px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700}
.t-info{flex:1;min-width:0}
.t-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-artist{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-play{font-size:12px;color:#aab2c4}
.tag{font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(46,196,182,.12);color:#0f8d84;margin-left:6px}
.mood{padding:14px}
.mood-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

--r-sm:8px;--r-md:12px;--r-lg:16px}
*{margin:0;padding:0;box-sizing:border-box}
:scope{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Roboto,sans-serif;
 background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{max-width:1440px;margin:0 auto;height:900px;display:flex;flex-direction:column;background:var(--bg);
 box-shadow:0 0 40px rgba(36,26,53,.08)}
.layout{flex:1;display:flex;min-height:0}
.sidebar{width:228px;flex-shrink:0;padding:20px 14px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.logo{display:flex;align-items:center;gap:8px;padding:0 8px 4px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--pink),var(--lilac));
 display:flex;align-items:center;justify-content:center;color:#fff}
.logo-name{font-size:16px;font-weight:700}
.logo-name small{display:block;font-size:10px;color:var(--sub);font-weight:500;letter-spacing:.08em}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:14px;color:#5c5375;cursor:pointer;transition:.18s}
.nav-item .material-icons{font-size:19px}
.nav-item:hover{background:#faf3fb}
.nav-item.active{background:linear-gradient(135deg,rgba(255,111,181,.16),rgba(199,125,255,.16));color:#c74a97;font-weight:600}
.nav-title{font-size:11px;color:#b6aecb;padding:6px 12px;letter-spacing:.06em}
.pl-item{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:10px;font-size:13px;color:#5c5375;cursor:pointer}
.pl-item:hover{background:#faf3fb}
.pl-dot{width:22px;height:22px;border-radius:7px;flex-shrink:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:62px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
.crumb{font-size:13px;color:var(--sub)}
.crumb b{color:var(--ink)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;background:#f5eff9;color:var(--sub);font-size:13px;cursor:pointer}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--peach),var(--pink));color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer}
.content{flex:1;overflow:auto;padding:24px 28px 12px}

/* 歌单头部 */
.head{display:grid;grid-template-columns:236px 1fr;gap:26px;padding:22px;border-radius:var(--r-lg);background:#fff;
 box-shadow:0 6px 20px rgba(36,26,53,.06);margin-bottom:22px;position:relative;overflow:hidden}
.head::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,111,181,.10),transparent 45%,rgba(199,125,255,.12));pointer-events:none}
.big-cover{position:relative;height:236px;border-radius:var(--r-md);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;
 background:linear-gradient(135deg,#ff8fb1,#c77dff 55%,#7b6ef6);box-shadow:0 12px 28px rgba(199,125,255,.35)}
.big-cover .material-icons{position:absolute;top:14px;left:14px;font-size:26px;color:rgba(255,255,255,.7)}
.big-cover .bc-mark{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);font-size:60px;font-weight:800;
 color:rgba(255,255,255,.42);letter-spacing:.05em}
.bc-play{position:absolute;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);
 color:#c74a97;display:flex;align-items:center;justify-content:center;cursor:pointer}
.head-info{display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.head-tag{display:inline-flex;gap:8px;margin-bottom:10px}
.head-tag i{font-style:normal;font-size:11px;padding:3px 10px;border-radius:14px;background:rgba(255,111,181,.13);color:#c74a97}
.head-info h1{font-size:27px;font-weight:800}
.head-desc{font-size:13px;color:var(--sub);margin:10px 0 16px;max-width:640px}
.owner{display:flex;align-items:center;gap:10px;font-size:13px}
.o-pic{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4cc9f0,#2ec4b6);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer}
.o-name{font-weight:600;color:#c74a97;cursor:pointer}
.o-time{font-size:11px;color:#b6aecb}
.head-acts{display:flex;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;gap:6px;padding:10px 20px;border-radius:22px;font-size:13px;font-weight:700;cursor:pointer;border:none}
.btn-main{background:linear-gradient(135deg,var(--pink),var(--lilac));color:#fff;box-shadow:0 6px 16px rgba(199,125,255,.4)}
.btn-ghost{background:#fff;color:#5c5375;border:1px solid var(--line)}
.btn:hover{transform:translateY(-1px)}
.head-stats{display:flex;gap:26px;margin-top:18px;font-size:12px;color:var(--sub)}
.head-stats b{display:block;font-size:19px;font-weight:800;color:var(--ink)}

.:scope{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.list-card{background:#fff;border-radius:var(--r-lg);padding:8px 18px 14px;box-shadow:0 4px 14px rgba(36,26,53,.05)}
.ltabs{display:flex;gap:20px;border-bottom:1px solid var(--line);font-size:14px;color:var(--sub);margin-bottom:4px}
.ltabs div{padding:12px 0;cursor:pointer;position:relative}
.ltabs div.on{color:#c74a97;font-weight:700}
.ltabs div.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:2px;
 background:linear-gradient(90deg,var(--pink),var(--lilac))}
.ltabs .right-tools{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#b6aecb}
.l-head{display:flex;align-items:center;font-size:11px;color:#b6aecb;padding:10px 4px}
.l-head span:nth-child(2),.l-sub{color:#b6aecb}
.row{display:flex;align-items:center;gap:13px;padding:9px 4px;border-bottom:1px solid #f8f4fb;cursor:pointer;border-radius:8px}
.row:hover{background:#fdf9fe}
.row.playing .r-name{color:#c74a97}
.rk{width:24px;text-align:center;font-size:13px;color:#c9c1dd;font-weight:600}
.mini{width:42px;height:42px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.m1{background:linear-gradient(135deg,#ff9a8b,#ffd479)}.m2{background:linear-gradient(135deg,#4cc9f0,#c77dff)}
.m3{background:linear-gradient(135deg,#ff6fb5,#c77dff)}.m4{background:linear-gradient(135deg,#2ec4b6,#a8f0c9)}
.m5{background:linear-gradient(135deg,#7b6ef6,#ff8fd0)}.m6{background:linear-gradient(135deg,#ffb347,#ff6f91)}
.m7{background:linear-gradient(135deg,#38c1d8,#8ad6f7)}.m8{background:linear-gradient(135deg,#f78fd8,#b28dff)}
.m9{background:linear-gradient(135deg,#8bd450,#2ec4b6)}.m10{background:linear-gradient(135deg,#c77dff,#4cc9f0)}
.m11{background:linear-gradient(135deg,#ffd479,#ff8fb1)}.m12{background:linear-gradient(135deg,#57c98a,#c9ef6a)}
.r-info{flex:1;min-width:0}
.r-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-artist{font-size:12px;color:var(--sub);margin-top:2px}
.r-alb{width:170px;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-tag{font-size:10px;padding:2px 7px;border-radius:6px;background:rgba(199,125,255,.14);color:#8a52c9;margin-left:8px}
.r-dur{width:42px;font-size:12px;color:var(--sub);text-align:right}
.r-act{width:62px;display:flex;justify-content:flex-end;gap:8px;color:#c9c1dd}
.r-act .material-icons{font-size:17px}
.r-act .material-icons:hover{color:#c74a97}
.side-card{background:#fff;border-radius:var(--r-md);padding:14px 16px;box-shadow:0 4px 14px rgba(36,26,53,.05);margin-bottom:16px}
.side-card h3{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.side-card h3 .material-icons{font-size:17px;color:#c74a97}
.similar{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.similar:last-child{border-bottom:none}
.s-cover{width:52px;height:52px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
 color:#fff;font-size:12px;font-weight:700}
.s-name{font-size:13px;font-weight:600}
.s-sub{font-size:11px;color:var(--sub);margin-top:3px}
.cmt{padding:10px 0;border-bottom:1px dashed var(--line)}
.cmt:last-child{border-bottom:none}
.cmt-top{display:flex;align-items:center;gap:8px;font-size:12px}
.cmt-pic{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.cmt-n{font-weight:600}
.cmt-like{margin-left:auto;color:#b6aecb;font-size:11px;display:flex;align-items:center;gap:2px}
.cmt p{font-size:12px;color:#5c5375;margin-top:6px}
.note{font-size:11px;color:#c9c1dd;padding-top:8px}
.playerbar{height:74px;flex-shrink:0;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px}
.pb-left{display:flex;align-items:center;gap:12px;width:270px}
.pb-cover{width:46px;height:46px;border-radius:9px;background:linear-gradient(135deg,#ff9a8b,#c77dff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pb-name{font-size:13px;font-weight:600}.pb-artist{font-size:11px;color:var(--sub)}
.pb-center{flex:1;display:flex;align-items:center;justify-content:center;gap:18px}
.ctrl{color:#5c5375;cursor:pointer;font-size:22px}.ctrl:hover{color:#c74a97}
.play{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--lilac));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(255,111,181,.4)}
.progress{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.bar{flex:1;height:4px;border-radius:2px;background:#f0e8f6;position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;width:38%;border-radius:2px;background:linear-gradient(90deg,var(--pink),var(--lilac))}
.bar i::after{content:'';position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.25)}
.pb-right{width:270px;display:flex;align-items:center;justify-content:flex-end;gap:10px;color:#5c5375}
}

/* 搜索大框 */
.search-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.box{flex:1;display:flex;align-items:center;gap:12px;height:56px;padding:0 10px 0 20px;border-radius:28px;background:#fff;
 box-shadow:0 6px 20px rgba(22,35,58,.09);border:2px solid transparent}
.box:focus-within{border-color:var(--sky)}
.box .material-icons{font-size:24px;color:#a8bccd}

 display:flex;align-items:center;justify-content:center;cursor:pointer}

.play{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--sea),var(--sky));color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(46,196,182,.4)}
.progress{flex:1;max-width:340px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub)}
.bar{flex:1;height:4px;border-radius:2px;background:#e8f1f7;position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;width:71%;border-radius:2px;background:linear-gradient(90deg,var(--sea),var(--sky))}
.bar i::after{content:'';position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.25)}
.pb-right{width:270px;display:flex;align-items:center;justify-content:flex-end;gap:10px;color:#425a72}
}

@scope (#app[data-view="player"]) {
:scope{--sun:#ff9a8b;--coral:#ff6fb5;--grape:#c77dff;--sea:#4cc9f0;--mint:#2ec4b6;
--ink:#f3f2ff;--sub:#a7a3c9;--line:rgba(255,255,255,.10);
--r-sm:8px;--r-md:12px;--r-lg:16px}
*{margin:0;padding:0;box-sizing:border-box}
:scope{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',Roboto,sans-serif;
 background:#0e0b1f;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
.shell{max-width:1440px;margin:0 auto;height:900px;display:flex;flex-direction:column;position:relative;overflow:hidden}
/* 日落渐变氛围背景 */
.bg{position:absolute;inset:0;background:
 radial-gradient(900px 520px at 18% 12%,rgba(255,154,139,.55),transparent 60%),
 radial-gradient(760px 520px at 82% 22%,rgba(199,125,255,.5),transparent 62%),
 radial-gradient(700px 500px at 60% 96%,rgba(76,201,240,.4),transparent 60%),
 linear-gradient(160deg,#20144b,#0e0b1f 70%)}
.topbar{position:relative;z-index:2;height:64px;display:flex;align-items:center;padding:0 32px;gap:14px}
.tb-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer}
.tb-btn:hover{color:#fff}
.title-mini{margin:0 auto;text-align:center}
.title-mini b{font-size:14px}
.title-mini span{display:block;font-size:11px;color:var(--sub)}
.player{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:520px 1fr;gap:48px;padding:12px 56px 8px;align-items:center}

/* 左：封面 */
.left{display:flex;flex-direction:column;align-items:center}
.disc-wrap{position:relative;width:340px;height:340px;margin-bottom:26px}
.disc{width:340px;height:340px;border-radius:50%;
 background:conic-gradient(from 0deg,#ff9a8b,#ff6fb5,#c77dff,#4cc9f0,#2ec4b6,#ff9a8b);
 display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(0,0,0,.5);
 animation:spin 22s linear infinite}
.disc-in{width:236px;height:236px;border-radius:50%;background:linear-gradient(135deg,#ff8fb1,#c77dff 60%,#7b6ef6);
 display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:6px}
.disc-in .material-icons{font-size:38px;color:rgba(255,255,255,.85)}
.disc-in b{font-size:22px;letter-spacing:.04em}
.disc-in span{font-size:12px;opacity:.88}
.disc-in em{font-size:10px;opacity:.7;font-style:normal;letter-spacing:.14em}
.disc-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;
 background:#0e0b1f;box-shadow:0 0 0 6px rgba(255,255,255,.16)}
@keyframes spin{to{transform:rotate(360deg)}}
.meta{text-align:center;margin-bottom:20px}
.meta h1{font-size:26px;font-weight:800}
.meta p{font-size:14px;color:var(--sub);margin-top:6px}
.meta .alb{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:5px 12px;border-radius:20px;
 background:rgba(255,255,255,.09);font-size:12px;color:#dcd6ff;cursor:pointer}
.q-tags{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.q-tag{font-size:11px;padding:4px 11px;border-radius:16px;border:1px solid var(--line);color:var(--sub);cursor:pointer}
.q-tag.on{background:#fff;color:#7b4fd6;border-color:transparent;font-weight:700}
.controls{width:100%;display:flex;align-items:center;justify-content:center;gap:22px;margin-bottom:16px}
.c-btn{color:#d9d4ff;cursor:pointer;font-size:26px;transition:.18s}
.c-btn:hover{color:#fff;transform:scale(1.08)}
.c-play{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#ff6fb5,#c77dff);color:#fff;
 display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 26px rgba(199,125,255,.5)}
.c-play .material-icons{font-size:34px}
.timeline{width:100%;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--sub)}
.tl-bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.16);position:relative;cursor:pointer}
.tl-bar i{position:absolute;left:0;top:0;bottom:0;width:46%;border-radius:3px;background:linear-gradient(90deg,#ff9a8b,#c77dff)}
.tl-bar i::after{content:'';position:absolute;right:-6px;top:-4px;width:14px;height:14px;border-radius:50%;background:#fff;
 box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* 右：歌词 */
.right{height:100%;display:flex;flex-direction:column;padding-top:8px;min-height:0}
.ly-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ly-head h2{font-size:16px;font-weight:700}
.ly-head .lang{margin-left:auto;display:flex;gap:8px}
.ly-head .lang span{font-size:11px;padding:4px 10px;border-radius:14px;background:rgba(255,255,255,.1);color:var(--sub);cursor:pointer}
.ly-head .lang span.on{background:#fff;color:#7b4fd6;font-weight:700}
.lyrics{flex:1;overflow:hidden;position:relative;padding:12px 4px 12px 0;
 mask-image:linear-gradient(180deg,transparent,#000 18%,#000 78%,transparent);
 -webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 78%,transparent)}
.line{padding:9px 0 9px 18px;border-left:2px solid transparent;transition:.2s}
.line b{display:block;font-size:19px;font-weight:600;color:#cfc9ef}
.line span{display:block;font-size:12px;color:#7f7aa3;margin-top:2px}
.line.on{border-left-color:#ff6fb5;background:linear-gradient(90deg,rgba(255,111,181,.14),transparent)}
.line.on b{font-size:23px;font-weight:800;color:#fff}
.line.on span{color:#ffd6ea}
.line.past b,.line.past span{opacity:.55}
.ly-foot{display:flex;align-items:center;gap:14px;padding:14px 0 4px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.ly-foot .material-icons{font-size:17px;cursor:pointer}
.ly-foot .material-icons:hover{color:#fff}
.queue{margin-top:14px;background:rgba(255,255,255,.06);border-radius:var(--r-md);padding:12px 14px}
.queue h4{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:8px;letter-spacing:.05em}
.q-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:#d9d4ff;cursor:pointer}
.q-row.on{color:#fff;font-weight:700}
.q-row .mini{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0}
.q-row .dur{margin-left:auto;font-size:11px;color:#7f7aa3}
.eq{display:flex;align-items:flex-end;gap:2px;height:14px}
.eq i{width:3px;background:linear-gradient(180deg,#ff6fb5,#c77dff);border-radius:2px;animation:eq 1s infinite ease-in-out}
.eq i:nth-child(1){height:60%;animation-delay:0s}
.eq i:nth-child(2){height:100%;animation-delay:.2s}
.eq i:nth-child(3){height:45%;animation-delay:.4s}
@keyframes eq{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.page-tag{position:relative;z-index:2;text-align:center;font-size:11px;color:#6b6690;padding:6px 0 14px}
}

body {
  margin: 0;
  font-family: Inter, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}

@layer baseline {
.material-icons {
  display: inline-block;
  flex-shrink: 0;
  font: normal 400 24px / 1 "Material Icons";
  font-feature-settings: "liga";
  white-space: nowrap;
  letter-spacing: normal;
  text-transform: none;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }

button.reset {
  background: transparent;
  color: inherit;
  border: 0;
  font: inherit;
  padding: 0;
  cursor: pointer;
  text-align: inherit;
}
}

:is(a, button, input, [tabindex]):focus-visible {
  outline: 2px solid #188a9f;
  outline-offset: 3px;
}

#app {
  min-height: 100vh;
  font-family: Inter, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --accent: #147e76;
}

#app:is([data-view="hot"], [data-view="playlist"], [data-view="player"]) { --accent: #a83b8a; }
#app[data-view="search"] { --accent: #197ca1; }

#app .shell { height: 100vh; height: 100dvh; }
#app .sidebar { overflow-y: auto; }
#app .sidebar .nav-item { white-space: nowrap; }
#app .main, #app .content { min-height: 0; }
#app .content { scrollbar-width: thin; overscroll-behavior: contain; }
#app .search { min-width: 0; }
#app .pb-left, #app .pb-right { width: auto; min-width: 0; }
#app .pb-left { flex: 0 1 248px; }
#app .pb-cover, #app .play, #app .c-play { flex-shrink: 0; }
#app .pb-track { display: flex; align-items: center; gap: 12px; min-width: 0; }
#app .pb-track > div:last-child { min-width: 0; }
#app .pb-track :is(.pb-name, .pb-artist) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#app .pb-right { flex: 0 1 200px; }
#app .pb-center { min-width: 0; }
#app .progress { min-width: 65px; }
#app :is(.ctrl, .pb-right, .timeline, .ly-foot, .r-act, .t-act) [data-action]:hover,
#app .song-title:hover,
#app [data-action]:is(.ctrl, .c-btn):hover { color: var(--accent); }

#app [data-action][aria-pressed="true"]:not(.play):not(.c-play) .material-icons,
#app .material-icons[data-action][aria-pressed="true"] { color: #ee5186; }

#app .song-title { display: inline; }
#app [data-track-id].current-track :is(.t-name, .r-name, .s-name) { color: var(--accent); }
#app [data-track-id].current-track .rk { color: var(--accent); }
#app [data-track-id] :is(.t-info, .r-info) { min-width: 0; }
#app .note { color: #647187; }
#app .nav-title { color: #6c7589; }
#app .no-results { padding: 24px 10px; color: #647187; font-size: 13px; }
#app .no-results:focus { outline: none; }
#app [data-action], #app a[href] { -webkit-tap-highlight-color: transparent; }
#app .hot-row[data-action] .h-name:hover { color: var(--accent); }

.seek {
  --fill: 0%;
  flex: 1;
  display: block;
  min-width: 0;
  height: 20px;
  margin: 0;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  background: transparent;
}
.seek::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 9px;
  background: linear-gradient(to right, #2ec4b6, #c77dff var(--fill), #e2e8f0 var(--fill));
}
.seek::-moz-range-track { height: 4px; border-radius: 9px; background: #e2e8f0; }
.seek::-moz-range-progress { height: 4px; border-radius: 9px; background: #c77dff; }
.seek::-webkit-slider-thumb {
  width: 11px;
  height: 11px;
  margin-top: -3.5px;
  background: white;
  border: 1px solid #b2a5d1;
  border-radius: 50%;
  box-shadow: 0 1px 3px #31204733;
  -webkit-appearance: none;
}
.seek::-moz-range-thumb { background: white; border: 1px solid #b2a5d1; border-radius: 50%; width: 10px; height: 10px; }

#app .view-groups { display: grid; gap: 10px; }
#app .group-item {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 12px;
  background: #fff;
  border: 1px solid #e6eaf0;
  border-radius: 10px;
  padding: 12px;
  color: var(--ink);
  font-size: 13px;
  text-align: left;
}
#app .group-item:hover { background: #fafcff; }
#app .group-item .material-icons { font-size: 20px; color: var(--accent); }
#app .group-item small { display: block; color: #647187; margin-top: 2px; }

#app[data-view="search"] .box { gap: 10px; min-width: 0; }
#app[data-view="search"] .kw { min-width: 0; width: 0; }
#app[data-view="search"] .kw:focus-visible { outline: none; }
#app[data-view="search"] .kw::-webkit-search-cancel-button { appearance: none; }
#app[data-view="search"] .s-btn { flex-shrink: 0; }
#app[data-view="search"] .tabs { flex-wrap: wrap; }
#app[data-view="search"] .card h3 .material-icons { margin-left: 0; }
#app[data-view="search"] .chips { align-items: center; }
#app[data-view="search"] .chip .material-icons[data-action] { cursor: pointer; }
#app[data-view="search"] mark { color: #125c7e; background: #dff5ff; border-radius: 3px; }

#app[data-view="player"] .shell { overflow-y: auto; background: #0e0b1f; }
#app[data-view="player"] .topbar { flex: 0 0 64px; }
#app[data-view="player"] .player {
  grid-template-columns: minmax(270px, 42%) minmax(0, 1fr);
  padding-inline: clamp(24px, 4vw, 56px);
  gap: clamp(24px, 3vw, 48px);
}
#app[data-view="player"] .disc-wrap, #app[data-view="player"] .disc {
  width: min(340px, 32vw, 39vh);
  height: auto;
  aspect-ratio: 1;
}
#app[data-view="player"] .disc-in { width: 70%; height: 70%; }
#app[data-view="player"] .disc-in b { max-width: 76%; text-align: center; font-size: clamp(14px, 1.7vw, 22px); }
#app[data-view="player"]:not(.is-playing) :is(.disc, .eq i) { animation-play-state: paused; }
#app[data-view="player"] .q-tags, #app[data-view="player"] .lang { flex-wrap: wrap; }
#app[data-view="player"] .lyrics {
  flex: 1 0 260px;
  min-height: 245px;
  max-height: 52vh;
  overflow: auto;
  scrollbar-width: thin;
  padding-block: 28px;
  mask-image: none;
}
#app[data-view="player"] .line span { color: #b9afd9; }
#app[data-view="player"] .line.on span { color: #ffd6ea; }
#app[data-view="player"] .lyrics[data-language="英文"] .line span,
#app[data-view="player"] .lyrics[data-language="中文"] .line b { display: none; }
#app[data-view="player"] .lyrics[data-language="中文"] .line span { font-size: 17px; }
#app[data-view="player"] .no-results, #app[data-view="player"] .page-tag { color: #b5aed4; }
#app[data-view="player"] .queue { max-height: 206px; overflow: auto; scrollbar-width: thin; }
#app[data-view="player"] .q-row { width: 100%; text-align: left; }
#app[data-view="player"] .q-row .dur { color: #b5aed4; }

#sheet {
  width: min(440px, calc(100% - 32px));
  max-height: min(590px, calc(100% - 32px));
  padding: 22px;
  box-sizing: border-box;
  border: 1px solid #e6e9f3;
  border-radius: 16px;
  color: #282138;
  background: #fff;
  box-shadow: 0 16px 64px #2116352e;
}
#sheet::backdrop { background: #1d152c66; }
#sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
#sheet h2 { font-size: 17px; margin: 0; }
#sheet p { font-size: 13px; color: #647187; margin: 12px 0; }
#sheet #sheet-items, #sheet form { display: grid; gap: 8px; margin-top: 12px; }
#sheet input { padding: 10px; border: 1px solid #dfe2ec; border-radius: 8px; }
#sheet .sheet-row {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #efeaf6;
  padding: 10px 12px;
  background: #f8f6fc;
  border-radius: 8px;
  color: #332747;
  text-align: left;
  cursor: pointer;
  font-size: 13px;
}
#sheet .sheet-row:hover { background: #f1eaf9; }
#sheet .sheet-row .material-icons { font-size: 18px; }
#sheet .sheet-row small { margin-left: auto; color: #647187; }
#notice {
  position: fixed;
  z-index: 10;
  pointer-events: none;
  bottom: max(96px, calc(16px + env(safe-area-inset-bottom)));
  left: 50%;
  max-width: calc(100% - 40px);
  width: max-content;
  transform: translateX(-50%);
  border-radius: 20px;
  background: #302641;
  color: white;
  padding: 9px 16px;
  opacity: 0;
  font-size: 13px;
  line-height: 1.45;
  text-align: center;
  transition: opacity .16s ease;
}
#notice.visible { opacity: 1; }

@media (max-width: 1170px) {
  #app:not([data-view="player"]) .sidebar { width: 184px; padding-inline: 10px; }
  #app[data-view="hot"] .content { grid-template-columns: minmax(0, 1fr) 250px; }
  #app[data-view="mine"] .two-col,

  #app[data-view="playlist"] .head { grid-template-columns: minmax(0, 1fr); padding: 14px; }

  #app[data-view="playlist"] .head-acts, #app[data-view="playlist"] .ltabs,

@media (max-width: 900px) {

  }

  .spotlight-image, .stage-dots button::before { transition: none; }
}

  :root {
  color-scheme: dark;
  --ink: #f9f3fc;
  --muted: #c5b8cf;
  --soft: #a89ab8;
  --accent-pink: #ffa6bd;
  --surface: #15101fe0;
  --raised: #20182ddc;
  --border: #f4dcff24;
}

html, body { background: #100d17; }
body { isolation: isolate; }
#app {
  position: relative;
  z-index: 1;
  background: transparent;
  color: var(--ink);
  font-family: Inter, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  --bg: transparent;
  --ink: #f9f3fc;
  --card: var(--surface);
  --sub: var(--muted);
  --line: var(--border);
  --accent: var(--accent-pink);
}

.page-ambience {
  position: fixed;
  z-index: 0;
  inset: 0;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #17101e;
}
.page-ambience::before { content: none; }
.page-ambience::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, #130d1ae8 0%, #1c112cb8 34%, #100c2190 66%, #19102155 100%),
    linear-gradient(0deg, #100d17f2 0%, #130d1e66 54%, #1a0f204a 100%),
    color-mix(in srgb, var(--portrait-color, #705b9c) 15%, transparent);
}
.wallpaper-photo {
  position: absolute;
  width: 100%;
  height: 100%;
  inset: 0;
  object-fit: cover;
  opacity: 0;
  scale: 1.02;
  transition: opacity .7s ease;
}
.wallpaper-photo.active { opacity: 1; }
body:has(#app[data-view="player"]) .page-ambience::after {
  background:
    linear-gradient(90deg, #130c1b99, #19102273 40%, #0d081bd9 100%),
    linear-gradient(0deg, #100a1adf, transparent 86%);
}

#app .shell {
  max-width: 1640px;
  background: transparent;
  box-shadow: none;
}
#app[data-view="player"] .bg { display: none; }
#app[data-view="player"] .shell { background: transparent; }
#app:not([data-view="player"]) .sidebar {
  width: 204px;
  border-color: #ffe9ff24;
  padding: 22px 15px 16px;
  background: #140e20d4;
  color: var(--ink);
}
#app .logo { gap: 10px; }
#app .logo-mark {
  width: 37px;
  height: 37px;
  background: linear-gradient(145deg, #ff826e, #cf5399 76%);
  box-shadow: 0 5px 18px #f1578b42;
  border-radius: 12px;
}
#app :is(.logo-name small,.nav-title) { color: var(--soft); }
#app .sidebar :is(.nav-item,.pl-item) { color: var(--muted); }
#app .sidebar :is(.nav-item,.pl-item):hover { color: var(--ink); background: #ffffff13; }
#app .sidebar .nav-item.active {
  color: #ffd2df;
  background: linear-gradient(100deg, #f26c9349, #b268ca1f);
  box-shadow: inset 2px 0 #ff9cb6;
}
#app .sidebar .pl-dot { opacity: .8; }
#app .wallpaper-button {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: auto;
  padding: 10px 9px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #ffffff0c;
  font-size: 12px;
  color: var(--ink);
}
#app .wallpaper-button .material-icons { font-size: 17px; color: var(--accent-pink); }
.wallpaper-button .wallpaper-current { flex-basis: 100%; padding-left: 24px; color: var(--soft); font-size: 10px; }
#app .wallpaper-button:hover { background: #ffc6ed17; border-color: #ffb9e34a; }

#app:not([data-view="player"]) .topbar {

}

#app .search-shortcut { border-color: #fae7ff26; background: #fff1ff0b; color: var(--muted); }
#app .content {
  padding: 24px clamp(18px, 2.5vw, 39px) 16px;

}

.image-cover {
  background-color: #291c34;
  background-image: var(--cover-image);
  background-size: cover;
  background-position: var(--cover-position, center);
  box-shadow: inset 0 0 0 1px #ffffff1b;

  background-size: cover;
  background-position: var(--cover-position, center);
}
.art-panel { position: relative; isolation: isolate; }
.art-panel::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background:
    linear-gradient(95deg, #130e1be8, #160e1fba 58%, #160d2382),
    var(--cover-image) var(--cover-position, center) / cover;

#app .discovery-feature {
  display: grid;

.artist-stage {

.stage-images .spotlight-image:nth-child(n) { left: 0; width: 100%; }

    linear-gradient(0deg, #150a1ee3, #1e10334a 58%, transparent);

.stage-copy { padding: 24px 24px 27px; width: min(74%, 580px); }

.stage-navigation { right: 12px; bottom: 12px; border-radius: 10px; background: #110a1bc4; }

.stage-counter { color: #ffeaf7; font: 11px/1.4 Inter, sans-serif; min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }

.listen-library {
  min-width: 0;
  margin: 0;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 18px;

.preview-grid { grid-template-columns: minmax(0,1fr); flex: 1; gap: 10px; }
.preview-tile {
  min-width: 0;
  min-height: 66px;

}
.preview-tile:hover, .preview-tile:focus-within { border-color: #ffcde76b; }

.preview-cover { flex-basis: 54px; width: 54px; height: 54px; border-radius: 8px; }
.preview-info h3 { color: #fff; font-size: 14px; }
.preview-info p { color: #ded0e6; font-size: 11px; }
#app .preview-play, #app .current-track .preview-play {

.portrait-section { margin: 0 0 28px; }

#app .group-item:hover { background: #352044; }

#app .search-hero {

a/artwork/dance.webp","records":"media/artwork/records.webp","good-to-go":"media/artwork/good-to-go.webp","already-there":"media/artwork/already-there.webp","swansong":"media/artwork/swansong.webp","favorite":"media/artwork/favorite.webp","recent":"media/artwork/recent.webp","offline":"media/artwork/offline.webp","podcast":"media/artwork/podcast.webp","discovery":"media/artwork/discovery.webp","comments":"media/artwork/comments.webp"},"spoken":[{"id":"evening-letter","title":"晚风来信","author":"夏日音乐原创","description":"一封放在窗台上的信，让忙碌的一天慢下来。原创微故事，合成人声朗读。","file":"evening-letter.mp3","duration":70.704,"artworkKey":"sunset","transcript":"傍晚，我收到一封没有邮票的信。信放在窗台上，压着一片金黄色的叶子。\n\n打开以后，纸上只有一行字：今天有没有给自己留一点时间？\n\n我想了想，把手机翻过去，泡了一杯温热的茶。楼下的车声远了，厨房的水壶安静了。窗帘被风轻轻托起来，像一艘准备出发的小船。\n\n原来，时间并没有走丢。它躲在没有赶路的片刻里，躲在一口茶的温度里，也躲在我终于听见自己的那一秒。\n\n我在信的背面写下回答：有的，就从现在开始。\n\n第二天清晨，窗台上的信不见了。那片叶子还在，边缘微微卷起，像一个终于放心的微笑。","credit":"原创微故事 · 合成人声朗读。旁白由 Windows System.Speech 本地生成，使用 Microsoft Huihui（zh-CN），语速 -1。音频经响度调整。","license":"CC0 1.0","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/","url":"media/spoken/evening-letter.mp3"},{"id":"mountain-minute","title":"山间的一分钟","author":"夏日音乐原创","description":"在一条山路上停一分钟，听见被脚步错过的声音。原创微故事，合成人声朗读。","file":"mountain-minute.mp3","duration":65.354,"artworkKey":"forest","transcript":"走到半山腰时，我决定停一分钟。\n\n山顶就在云后，导航还在计算距离。可路边一块长着青苔的石头，像是在邀请我坐下。\n\n第一声，是鞋底离开碎石的轻响。第二声，是风穿过竹叶。接着，一只鸟在很近的地方叫了两下，又把安静还给树林。\n\n我看见一滴水从叶尖落下。它没有赶时间，却准确地落进小小的水洼，推开一圈又一圈细纹。\n\n一分钟到了，我没有立刻起身。原来沿途的风景，从来不只为了让人到达。\n\n后来，我还是走到了山顶。但记得最清楚的，是半山腰那块石头，和那一分钟里，终于不必向谁证明什么的自己。","credit":"原创微故事 · 合成人声朗读。旁白由 Windows System.Speech 本地生成，使用 Microsoft Kangkang（zh-CN），语速 -1。音频经响度调整。","license":"CC0 1.0","licenseUrl":"https://creativecommons.org/publicdomain/zero/1.0/","url":"media/spoken/mountain-minute.mp3"},{"id":"old-bookshop","title":"旧书店","author":"夏日音乐原创","description":"雨天走进旧书店，在空白书页里遇见一个新的开始。原创微故事，合成人声朗读。","file":"old-bookshop.mp3","duration":68.108,"artworkKey":"books","transcript":"下雨的时候，我走进街角那家旧书店。门上的铜铃响了，老板从   <script>
  (() => {
  'use strict';

  const sampleRate = 11025;
  const fftSize = 2048;
  const hopSize = 512;
  const bands = 40;
  const deltaDistance = 3;
  const maximumQuerySeconds = 20;
  const maximumReferenceSeconds = 120;
  const frameSeconds = hopSize / sampleRate;
  const window = Float32Array.from({ length: fftSize }, (_, i) => .5 - .5 * Math.cos(2 * Math.PI * i / (fftSize - 1)));
  const bandEdges = Float32Array.from({ length: bands + 2 }, (_, i) => 85 * (4900 / 85) ** (i / (bands + 1)));

  function cancelled(signal) {
    if (signal?.aborted) throw new DOMException('Audio matching was cancelled', 'AbortError');
  }

  function yieldToBrowser() {
    return new Promise((resolve) => setTimeout(resolve, 0));
  }

  function transform(real, imaginary) {
    for (let i = 1, j = 0; i < fftSize; i++) {
      let bit = fftSize >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) {
        const value = real[i];
        real[i] = real[j];
        real[j] = value;
      }
    }
    for (let length = 2; length <= fftSize; length *= 2) {
      const angle = -2 * Math.PI / length;
      const stepReal = Math.cos(angle);
      const stepImaginary = Math.sin(angle);
      for (let start = 0; start < fftSize; start += length) {
        let twiddleReal = 1;
        let twiddleImaginary = 0;
        for (let i = 0; i < length / 2; i++) {
          const left = start + i;
          const right = left + length / 2;
          const rightReal = real[right] * twiddleReal - imaginary[right] * twiddleImaginary;
          const rightImaginary = real[right] * twiddleImaginary + imaginary[right] * twiddleReal;
          real[right] = real[left] - rightReal;
          imaginary[right] = imaginary[left] - rightImaginary;
          real[left] += rightReal;
          imaginary[left] += rightImaginary;
          const next = twiddleReal * stepReal - twiddleImaginary * stepImaginary;
          twiddleImaginary = twiddleReal * stepImaginary + twiddleImaginary * stepReal;
          twiddleReal = next;
        }
      }
    }
  }

  function normalize(vector, removeMean) {
    const mean = removeMean ? vector.reduce((sum, value) => sum + value, 0) / vector.length : 0;
    let norm = 0;
    for (let i = 0; i < vector.length; i++) {
      vector[i] -= mean;
      norm += vector[i] * vector[i];
    }
    const scale = Math.sqrt(norm) || 1;
    for (let i = 0; i < vector.length; i++) vector[i] /= scale;
    return vector;
  }

  function bandPowers(real, imaginary) {
    const powers = new Float32Array(bands);
    for (let bin = 1; bin < fftSize / 2; bin++) {
      const frequency = bin * sampleRate / fftSize;
      if (frequency < bandEdges[0] || frequency > bandEdges[bands + 1]) continue;
      const power = real[bin] * real[bin] + imaginary[bin] * imaginary[bin];
      for (let band = 0; band < bands; band++) {
        if (frequency < bandEdges[band] || frequency > bandEdges[band + 2]) continue;
        const center = bandEdges[band + 1];
        const weight = frequency <= center
          ? (frequency - bandEdges[band]) / (center - bandEdges[band])
          : (bandEdges[band + 2] - frequency) / (bandEdges[band + 2] - center);
        powers[band] += power * weight;
      }
    }
    return powers;
  }

  async function monoSamples(buffer, limit, signal) {
    cancelled(signal);
    const duration = Math.min(buffer.duration, limit);
    const context = new OfflineAudioContext(1, Math.ceil(duration * sampleRate), sampleRate);
    const source = context.createBufferSource();
    source.buffer = buffer;
    source.connect(context.destination);
    source.start();
    const rendered = await context.startRendering();
    cancelled(signal);
    return rendered.getChannelData(0);
  }

  async function fingerprint(buffer, limit, signal) {
    const samples = await monoSamples(buffer, limit, signal);
    const frames = [];
    const real = new Float32Array(fftSize);
    const imaginary = new Float32Array(fftSize);
    let sumEnergy = 0;
    for (let start = 0; start + fftSize <= samples.length; start += hopSize) {
      imaginary.fill(0);
      let energy = 0;
      for (let i = 0; i < fftSize; i++) {
        const value = samples[start + i];
        real[i] = value * window[i];
        energy += value * value;
      }
      sumEnergy += energy / fftSize;
      transform(real, imaginary);
      const logs = bandPowers(real, imaginary).map((value) => Math.log(1e-9 + value));
      const shape = normalize(logs.slice(), true);
      const delta = new Float32Array(bands);
      const past = frames[frames.length - deltaDistance];
      if (past) {
        for (let band = 0; band < bands; band++) delta[band] = logs[band] - past.logs[band];
        normalize(delta, true);
      }
      frames.push({ shape, delta, logs, energy: energy / fftSize });
      if (frames.length % 128 === 0) {
        cancelled(signal);
        await yieldToBrowser();
      }
    }
    return { frames, rms: Math.sqrt(sumEnergy / Math.max(1, frames.length)) };
  }

  function cosine(left, right) {
    let sum = 0;
    for (let i = 0; i < bands; i++) sum += left[i] * right[i];
    return sum;
  }

  async function compare(query, reference, signal) {
    const first = deltaDistance + 1;
    const last = query.frames.length - 1;
    const queryLength = last - first;
    if (queryLength <= 0 || reference.frames.length < query.frames.length) return { score: 0, offset: 0 };
    let best = -1;
    let bestFrame = 0;
    for (let offset = 0; offset <= reference.frames.length - query.frames.length; offset++) {
      let sum = 0;
      let included = 0;
      for (let i = first; i < last; i += 2) {
        const left = query.frames[i];
        const right = reference.frames[offset + i];
        if (left.energy < 1e-7 || right.energy < 1e-7) continue;
        sum += .46 * cosine(left.shape, right.shape) + .54 * cosine(left.delta, right.delta);
        included++;
      }
      const score = included >= queryLength / 4 ? sum / included : 0;
      if (score > best) {
        best = score;
        bestFrame = offset;
      }
      if (offset % 128 === 0) {
        cancelled(signal);
        await yieldToBrowser();
      }
    }
    return { score: best, offset: bestFrame * frameSeconds };
  }

  function create({ tracks, onProgress } = {}) {
    if (!Array.isArray(tracks) || !tracks.length ||
        tracks.some((track) => !track.id || !track.url || !track.title)) {
      throw new TypeError('Supply tracks with id, title, and url.');
    }
    const prepared = new Map();
    let decoder;
    let disposed = false;

    async function decode(input, signal) {
      cancelled(signal);
      if (disposed) throw new Error('This audio matcher is closed.');
      if (input && typeof input.getChannelData === 'function') return input;
      if (input instanceof Blob && input.size > 30 * 1024 * 1024) throw new Error('Audio files must be smaller than 30 MB.');
      if (!decoder) decoder = new AudioContext();
      const data = input instanceof Blob ? await input.arrayBuffer() : input;
      if (!(data instanceof ArrayBuffer)) throw new TypeError('Choose an audio File, Blob, ArrayBuffer, or AudioBuffer.');
      if (data.byteLength > 30 * 1024 * 1024) throw new Error('Audio files must be smaller than 30 MB.');
      const buffer = await decoder.decodeAudioData(data.slice(0));
      cancelled(signal);
      return buffer;
    }

    async function prepare(track, signal) {
      if (prepared.has(track.id)) return prepared.get(track.id);
      const response = await fetch(track.url, { signal });
      if (!response.ok) throw new Error('A reference song could not be loaded.');
      const buffer = await decode(await response.arrayBuffer(), signal);
      const result = await fingerprint(buffer, maximumReferenceSeconds, signal);
      prepared.set(track.id, result);
      return result;
    }

    async function identify(input, { signal } = {}) {
      const buffer = await decode(input, signal);
      if (buffer.duration < 6) return { matched: false, id: null, title: null, offset: null, confidence: 0, reason: 'too-short', candidates: [] };
      onProgress?.({ phase: 'query' });
      const query = await fingerprint(buffer, maximumQuerySeconds, signal);
      if (query.rms < .0007) return { matched: false, id: null, title: null, offset: null, confidence: 0, reason: 'silence', candidates: [] };
      const candidates = [];
      for (const [index, track] of tracks.entries()) {
        cancelled(signal);
        onProgress?.({ phase: 'reference', index, total: tracks.length, title: track.title });
        const reference = await prepare(track, signal);
        const score = await compare(query, reference, signal);
        candidates.push({ id: track.id, title: track.title, score: Math.max(0, score.score), offset: Number(score.offset.toFixed(2)) });
      }
      candidates.sort((left, right) => right.score - left.score);
      const best = candidates[0];
      const margin = best.score - (candidates[1]?.score ?? 0);
      const matched = best.score >= .72 && margin >= .075;
      const confidence = matched ? Math.min(.99, Math.max(.5, (best.score - .5) * 1.9)) : Math.max(0, best.score - .35);
      return {
        matched,
        id: matched ? best.id : null,
        title: matched ? best.title : null,
        confidence: Number(confidence.toFixed(2)),
        offset: matched ? best.offset : null,
        reason: matched ? 'match' : 'no-match',
        candidates: candidates.map((item) => ({ ...item, score: Number(item.score.toFixed(3)) })),
      };
    }

    async function dispose() {
      disposed = true;
      prepared.clear();
      await decoder?.close();
      decoder = null;
    }

    return Object.freeze({ identify, dispose });
  }

  globalThis.SunnyAudioMatch = Object.freeze({ create });
})();

  (() => {
  'use strict';
  function create(api) {
    const { sheet, element, icon, openSheet, notice } = api;
    let controller, recorder, microphone, timer, stopTimer, player;
    let urls = [];
    let session = 0;
    let loading = false;
    let abortNotice;
    const keyInputs = new Set();
    function control(label, glyph, action, className = 'hub-subtle') {
      const node = element('button', className);
      node.type = 'button';
      node.append(icon(glyph), document.createTextNode(label));
      node.addEventListener('click', () => action(node));
      return node;
    }
    function field(name, type = 'text', value = '') {
      const input = element('input');
      input.type = type;
      input.value = value;
      input.setAttribute('aria-label', name);
      const label = element('label', 'cloud-field', name);
      label.append(input);
      return { input, label };
    }
    function select(name, options) {
      const input = element('select');
      input.setAttribute('aria-label', name);
      for (const [value, label] of options) {
        const option = element('option', '', label);
        option.value = value;
        input.append(option);
      }
      const label = element('label', 'cloud-field', name);
      label.append(input);
      return { input, label };
    }
    function link(label, url) {
      const anchor = element('a', 'hub-external', label);
      anchor.href = url;
      anchor.target = '_blank';
      anchor.rel = 'noopener noreferrer';
      return anchor;
    }
    function connection(service, items) {
      const names = { audd: 'AudD', elevenlabs: 'ElevenLabs Music', minimax: 'MiniMax Music' };
      const details = element('details', 'cloud-connection');
      const summary = element('summary', '', '服务设置 · ' + names[service]);
      const status = element('p', 'connection-status', '正在检查服务…');
      const own = field(names[service] + ' API 密钥', 'password');
      own.input.autocomplete = 'off';
      own.input.spellcheck = false;
      own.input.maxLength = 1024;
      own.input.placeholder = '使用自己的密钥（仅本次窗口）';
      keyInputs.add(own.input);
      const address = service === 'audd' ? 'https://dashboard.audd.io/' : service === 'elevenlabs' ? 'https://elevenlabs.io/app/developers/api-keys' : 'https://platform.minimax.io/user-center/basic-information/interface-key';
      details.append(summary, own.label, element('small', '', '密钥仅在本窗口中使用，关闭即清除；使用自己的密钥时，费用计入你的服务账号。'), link('获取 ' + names[service] + ' 密钥', address));
      items.append(status, details);
      let shared = false;
      fetch('/api/ai/status', { cache: 'no-store' }).then(async (response) => {
        if (!response.ok) throw new Error();
        return response.json();
      }).then((data) => {
        if (!status.isConnected) return;
        shared = Boolean(data.services?.[service]?.ready);
        status.textContent = shared ? '网站服务已配置 · ' + names[service] : '网站服务待配置 · 可使用自己的 ' + names[service] + ' 密钥';
        status.dataset.connected = String(shared);
        details.open = !shared;
      }).catch(() => {
        if (status.isConnected) status.textContent = '暂时无法连接服务，请刷新页面后重试。';
      });
      return {
        hasAccess() {
          if (shared || own.input.value.trim()) return true;
          details.open = true;
          own.input.focus();
          notice('请先配置 ' + names[service] + ' 服务密钥。');
          return false;
        },
        headers() { return own.input.value.trim() ? { 'X-Sunny-Provider-Key': own.input.value.trim() } : {}; },
        remove() { keyInputs.delete(own.input); own.input.value = ''; status.remove(); details.remove(); },
      };
    }
    function cancelRecording() {
      clearInterval(timer);
      clearTimeout(stopTimer);
      if (recorder?.state === 'recording') recorder.stop();
      microphone?.getTracks().forEach((track) => track.stop());
      microphone = null;
    }
    function cleanup() {
      session++;
      controller?.abort();

      const dy = event.shiftKey ? 0 : event.deltaY;
      if (!dx || Math.abs(dx) < Math.abs(dy) * 1.4) return;
      event.preventDefault();
      const now = performance.now();
      onInteract();
      if (now < wheelNext) return;
      if (now - wheelAt > 180 || Math.sign(wheelTotal) !== Math.sign(dx)) wheelTotal = 0;
      wheelAt = now;
      wheelTotal += dx * (event.deltaMode === 1 ? 16 : 1);
      if (Math.abs(wheelTotal) >= 52) {

    const weekday = weekdays[now.getDay()];

          button.replaceChildren(icon('mic'), document.createTextNode('录音识别 · 10 秒'));

        button.disabled = false;
        button.replaceChildren(icon('stop'), document.createTextNode('停止并识别'));
        status.textContent = '正在录音 · 0 / 10 秒';

      }
    }

    async function identify(file, status, result) {
      if (file.size > 20 * 1024 * 1024) { status.textContent = '文件较大，请选择不超过 20 MB 的短片段。'; return; }
      analysis?.abort();
      analysis = new AbortController();
      const signal = analysis.signal;
      if (!matchEngine) matchEngine = window.SunnyAudioMatch.create({
        tracks: demoIds.map((id) => ({ id, title: tracks.get(id).name, url: tracks.get(id).audioUrl })),
      });
      status.textContent = '正在分析音频指纹…';
      result.replaceChildren();
      try {
        const found = await matchEngine.identify(file, { signal });
        if (signal.aborted || !result.isConnected) return;
        if (!found.matched) {
          const reasons = { silence: '这段音频较安静，请换一个更清晰的片段。', 'too-short': '片段太短，请提供 8–12 秒的清晰音频。' };
          status.textContent = reasons[found.reason] || '本站试听曲库中没有找到匹配。';
          return;
        }
        status.textContent = '找到了 · 匹配度 ' + Math.round(found.confidence * 100) + '%';
        result.append(picture(found.id), element('strong', '', found.title), element('p', '', tracks.get(found.id).artist));
        result.append(control('从匹配位置播放', 'play_arrow', () => {
          sheet.close();
          api.playTrack(found.id, true, Math.max(0, found.offset));
          api.goPlayer();
        }, 'hub-primary'));
      } catch (error) {
        if (signal.aborted) return;
        status.textContent = '暂时无法解析这个音频。请换一个 MP3、WAV 或录音片段。';
      }
    }

    function stopAuxiliary() {
      spokenAudio?.pause();
      cloud.stopAudio();
    }

    function clearDialogMedia() {
      analysis?.abort();
      stopRecording();
      stopAuxiliary();
      save('spoken-progress', storedBookProgress);
      if (spokenAudio) { spokenAudio.removeAttribute('src'); spokenAudio.load(); }
      spokenAudio = null;
      bookControl = null;
      for (const iframe of sheet.querySelectorAll('iframe')) iframe.remove();

    window.addEventListener('pagehide', () => {
      clearDialogMedia();
      matchEngine?.dispose();
      for (const url of spokenBuffers.values()) URL.revokeObjectURL(url);
    });

    return {
      mount, updatePlayback, stopAuxiliary, showVideo,
      appendCredits(items) {
        items.append(element('h3', '', '听书 · 原创微故事'));
        for (const book of media.spoken) {
          const item = element('article', 'credit-entry');
          item.append(element('strong', '', book.title), element('p', '', book.credit), external(book.license, book.licenseUrl));
          items.append(item);
        }
        items.append(external('本周榜单来源 · ' + media.weekly.date, media.weekly.source));
      },
    };
  }

  function addPager(heading, viewport, { id, title, capacity, period, columns = false }) {
    const cards = [...viewport.children];
    const controls = element('div', 'pager-controls');
    controls.setAttribute('role', 'group');
    controls.setAttribute('aria-label', title + '翻页');
    const previous = queueButton('keyboard_arrow_left', '', '', title + '上一页');
    const next = queueButton('keyboard_arrow_right', '', '', title + '下一页');
    const toggle = queueButton('pause', '', '', '');
    const display = element('span', 'pager-count');
    controls.append(previous, display, next, toggle);
    heading.append(controls);
    viewport.dataset.gallery = id;
    viewport.classList.add('pager-viewport');
    viewport.setAttribute('aria-label', title);
    viewport.setAttribute('aria-roledescription', '轮播');

    let size = capacity();
    let page = 0;
    let enabled = getStored('pager:' + id, !reducedMotion.matches);
    let nextTick = Date.now() + period;
    let transition;
    const pageCount = () => Math.ceil(cards.length / size);

    function displayPage(animate = false, slideDirection = 0) {
      const low = page * size;
      for (const [i, card] of cards.entries()) card.hidden = i < low || i >= low + size;
      if (columns) viewport.style.setProperty('--gallery-columns', String(size));
      viewport.dataset.page = String(page + 1);
      controls.hidden = pageCount() <= 1;
      display.textContent = (page + 1) + ' / ' + pageCount();
      display.setAttribute('aria-label', '第 ' + (page + 1) + ' 页，共 ' + pageCount() + ' 页');
      toggle.title = (enabled ? '暂停' : '开启') + title + '自动翻页';
      toggle.setAttribute('aria-label', toggle.title);
      setText('.material-icons', enabled ? 'pause' : 'play_arrow', toggle);
      if (animate && !reducedMotion.matches) {
        transition?.cancel();
        transition = viewport.animate(
          slideDirection ? [
            { opacity: .4, transform: 'translateX(' + (slideDirection * 4) + '%) scale(.97)' },
            { opacity: 1, transform: 'translateX(' + (-slideDirection * .4) + '%) scale(1.005)', offset: .7 },
            { opacity: 1, transform: 'translateX(0) scale(1)' },
          ] : [
            { opacity: .2, transform: 'translateY(24px) scale(.92)' },
            { opacity: 1, transform: 'translateY(-8px) scale(1.025)', offset: .5 },
            { transform: 'translateY(3px) scale(.992)', offset: .76 },
            { opacity: 1, transform: 'translateY(0) scale(1)' },
          ],
          { duration: slideDirection ? 470 : 630, easing: 'cubic-bezier(.2,.7,.2,1)' },
        );
      }
    }

    function advance(direction, gesture) {
      if (pageCount() < 2) return;
      page = (page + direction + pageCount()) % pageCount();
      nextTick = Date.now() + period;
      displayPage(true, gesture === 'swipe' ? direction : 0);
    }

    previous.addEventListener('click', () => advance(-1));
    next.addEventListener('click', () => advance(1));
    toggle.addEventListener('click', () => {
      enabled = !enabled;
      nextTick = Date.now() + period;
      store('pager:' + id, enabled);
      displayPage();
    });
    addSwipe(viewport, advance, () => { nextTick = Date.now() + period; });
    homePagers.push({
      tick(now) {
        if (!enabled || now < nextTick || viewport.classList.contains('swipe-active') || viewport.matches(':hover, :focus-within')) return;
        advance(1);
      },
      resize() {
        const wanted = capacity();
        if (wanted === size) return;
        page = Math.floor(page * size / wanted);
        size = wanted;
        displayPage();
      },
    });
    displayPage();
  }

  const aliases = new Map([
    ['泰勒', 'taylor swift'], ['梅梅', 'taylor swift'], ['泰勒·斯威夫特', 'taylor swift'],
    ['夏日歌单', '夏日'], ['欧美热歌 50', '欧美'], ['晚自习专注', '专注'],
  ]);

  function matches(keyword, values) {
    const haystack = normalize(values.join(' ')).replace(/[·×]/g, ' ');
    const needle = normalize(aliases.get(keyword) ?? keyword).replace(/[·×]/g, ' ');
    return needle.split(/\s+/).filter(Boolean).every((part) => haystack.includes(part));
  }

  function historyRow(container) {
    container.replaceChildren(...historyItems.map((word) => {
      const chip = element('div', 'chip');

      chip.append(link, bind(icon('close'), 'remove-history', word, '移除搜索记录 ' + word));
      return chip;
    }));
    if (!historyItems.length) container.append(empty('暂无搜索历史'));
  }

  function highlight(node, value, keyword) {
    const words = keyword.trim().split(/[\s·×]+/).filter(Boolean).sort((a, b) => b.length - a.length);
    if (!words.length) { node.textContent = value; return; }
    const pattern = new RegExp(words.map((word) => word.replace(/[.*+?^$(){}|\[\]\\]/g, '\\$&')).join('|'), 'giu');
    let end = 0;
    const content = [];
    for (const hit of value.matchAll(pattern)) {
      content.push(document.createTextNode(value.slice(end, hit.index)), element('mark', '', hit[0]));
      end = hit.index + hit[0].length;
    }
    content.push(document.createTextNode(value.slice(end)));
    node.replaceChildren(...content);
  }

  function searchSuggestions(keyword) {
    if (!keyword) return historyItems.slice(0, 5).map((value) => ({ kind: 'history', title: value, value, detail: '最近搜索' }));
    const songs = [...tracks.values()]
      .filter((track) => matches(keyword, [track.name]))
      .slice(0, 4)
      .map((track) => ({ kind: 'track', title: track.name, value: track.id, detail: '单曲 · ' + track.artist }));
    const artists = [...artistData.keys()]
      .filter((artist) => matches(keyword, [artist]))
      .slice(0, 2)
      .map((artist) => ({ kind: 'artist', title: artist, value: artist, detail: '歌手' }));
    const lists = Object.entries(playlists)
      .filter(([, entry]) => matches(keyword, [entry.title, entry.tag]))
      .slice(0, 2)
      .map(([value, entry]) => ({ kind: 'playlist', title: entry.title, value, detail: '歌单 · ' + entry.tracks.length + ' 首' }));
    return [...songs, ...artists, ...lists];
  }

  function selectSuggestion(index) {
    const options = all('.search-option');

    const active = (index + options.length) % options.length;
    options.forEach((node, i) => node.setAttribute('aria-selected', String(i === active)));
    query('.kw').setAttribute('aria-activedescendant', options[active].id);
    options[active].scrollIntoView({ block: 'nearest' });
